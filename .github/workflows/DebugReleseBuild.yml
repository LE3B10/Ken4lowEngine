# ---------- YAMLファイル名 ---------- #
name: BuildTests

# ---------- トリガー ---------- #
on: 
  push:
    branches:
      - master

# ---------- 環境変数 ---------- #
env:
  SOLUTION_FILE_PATH: Project/Ken4lowEngine.sln

# ---------- ジョブ ---------- #
jobs:
  # ---------- デバッグビルドジョブ ---------- #
  debug-build:
    runs-on: windows-2022
    env:
      CONFIGURATION: Debug
    steps:
      - name: CheckOut
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with: 
          msbuild-architecture: x64

      # ① 先に imgui.vcxproj だけを Debug でビルドして imgui.lib を作る
      - name: Build ImGui (Debug)
        run: >
          msbuild Project/Externals/imgui/imgui.vcxproj
          /p:Platform=x64
          /p:Configuration=${{ env.CONFIGURATION }}
          /p:SolutionDir=Project\

      # ② そのあとでソリューション全体を Debug でビルド
      - name: Build Debug
        run: >
          msbuild ${{ env.SOLUTION_FILE_PATH }}
          /p:Platform=x64
          /p:Configuration=${{ env.CONFIGURATION }}

  # ---------- リリースビルドジョブ ---------- #
  release-build:
    runs-on: windows-2022
    env:
      CONFIGURATION: Release
    steps:
      - name: CheckOut
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with: 
          msbuild-architecture: x64

      - name: Build Release
        run: >
          msbuild ${{ env.SOLUTION_FILE_PATH }}
          /p:Platform=x64
          /p:Configuration=${{ env.CONFIGURATION }}
