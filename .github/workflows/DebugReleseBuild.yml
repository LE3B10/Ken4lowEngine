# ---------- Workflow名 ---------- #
name: BuildTests

# ---------- トリガー ---------- #
on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

# ---------- 環境変数 ---------- #
env:
  # リポジトリのルートを基準にしたSolutionファイルのパス
  SOLUTION_FILE_PATH: Project/Ken4lowEngine.sln

# ---------- ジョブ ---------- #
jobs:
  build:
    name: Build ${{ matrix.configuration }}

    # Visual Studio 2026とv145 Toolsetが入った公開Repository用Runner
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Show MSBuild Version
        run: msbuild -version

      - name: Build ${{ matrix.configuration }}
        shell: pwsh
        run: |
          $logPath = "msbuild-${{ matrix.configuration }}.log"
          & msbuild "${{ env.SOLUTION_FILE_PATH }}" /m /t:Rebuild /p:Platform=x64 /p:Configuration=${{ matrix.configuration }} /verbosity:minimal "/clp:ErrorsOnly;Summary" *> $logPath
          $buildExitCode = $LASTEXITCODE
          # Phase 7の検証中は失敗理由だけをActionsログへ出して修正箇所を特定しやすくする。
          Get-Content $logPath | Where-Object { $_ -match 'error (C|LNK|MSB)[0-9]+|Build FAILED|[0-9]+ Error\(s\)' }
          exit $buildExitCode